# nginx/nginx.prod.conf — Reference Nginx reverse proxy configuration for Dzeroth.
#
# This is a reference configuration. It must be adapted to the operator's environment
# before use: replace placeholder certificate paths and domain names.
#
# Topology: Internet → Nginx (TLS termination) → Go API (plain HTTP on :8080)
#
# Required operator actions before use:
#   1. Replace /path/to/cert.pem with your TLS certificate path
#      (e.g. /etc/letsencrypt/live/your-domain.com/fullchain.pem)
#   2. Replace /path/to/key.pem with your TLS private key path
#      (e.g. /etc/letsencrypt/live/your-domain.com/privkey.pem)
#   3. Replace your-domain.com with your actual domain name
#   4. Ensure the 'api' hostname resolves to the Go API container
#      (it resolves automatically when both services are on the same Docker network)
#
# Security notes:
#   - proxy_set_header X-Real-IP $remote_addr; sets the IP from the accepted TCP
#     connection — the real client IP as seen by Nginx. This does NOT trust any
#     client-supplied header. This is the CORRECT setting.
#   - Do NOT use proxy_set_header X-Real-IP $http_x_real_ip; — that would trust
#     the client's header and allow IP spoofing to bypass rate limits.
#   - proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; appends the
#     real client IP to any existing X-Forwarded-For chain.
#   - The Go API's chi.RealIP middleware reads X-Real-IP and X-Forwarded-For set
#     here. Because Nginx controls these headers (client values are not forwarded),
#     per-IP rate limiting is reliable.
#
# See docs/DEPLOYMENT_TOPOLOGY.md — Trusted reverse proxy requirement.

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream dzeroth_api {
    # 'api' resolves to the dzeroth-api container on the shared Docker bridge network.
    server api:8080;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name your-domain.com;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name your-domain.com;

    # ── TLS ───────────────────────────────────────────────────────────────────
    # Replace with your certificate paths.
    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # TLS protocol and cipher hardening.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Strict-Transport-Security ─────────────────────────────────────────────
    # HSTS belongs at the reverse proxy, not the application server.
    # Start with a short max-age (86400 = 1 day) and increase after validating.
    # Do not add 'includeSubDomains' or 'preload' without careful consideration.
    add_header Strict-Transport-Security "max-age=86400" always;

    # ── Proxy timeouts ────────────────────────────────────────────────────────
    # Match the Go API's 30-second handler timeout (WriteTimeout=30s in main.go).
    # Add a small buffer above the application timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;
    send_timeout          35s;

    # ── Forwarding headers ────────────────────────────────────────────────────
    # IMPORTANT: X-Real-IP is set to $remote_addr — the IP of the TCP connection
    # accepted by Nginx. This is the real client IP. Nginx does not forward any
    # client-supplied X-Real-IP header.
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host             $host;

    # Disable passing client-supplied X-Real-IP to the backend.
    # (proxy_set_header X-Real-IP $remote_addr above already overrides the client header.)
    proxy_pass_request_headers on;

    # ── HTTP version and connection ───────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Routes ────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://dzeroth_api;
    }

    # ── Admin port is NOT proxied ─────────────────────────────────────────────
    # The admin port (:9091) must never be exposed through this proxy.
    # It is accessible only from within the Docker network or via SSH tunnel.
    # See docs/DEPLOYMENT_TOPOLOGY.md — Admin port (:9091).
}
